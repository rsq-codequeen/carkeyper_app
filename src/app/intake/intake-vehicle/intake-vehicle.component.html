<div class="flex flex-col w-full h-screen bg-[#0a0a0c] text-white">
  <app-navbar [message]="'Vehicle Intake Dashboard'"></app-navbar>
  
  <div class="flex flex-1 overflow-hidden pt-16">
    <app-sidebar class="w-20"></app-sidebar>
    
    <main class="flex-1 p-8 overflow-y-auto custom-scrollbar">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-[#121214] p-6 rounded-2xl border border-white/5 border-l-4 border-seagreen shadow-xl relative overflow-hidden">
          <div class="absolute top-0 right-0 w-16 h-16 bg-seagreen/5 blur-2xl"></div>
          <h3 class="text-seagreen font-bold uppercase text-[10px] tracking-[0.2em]">Total Handover Records</h3>
          <p class="text-4xl font-black text-white mt-1">{{ intakes.length | number:'2.0' }}</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 bg-[#121214] p-8 rounded-2xl shadow-2xl border border-white/5 relative">
          <div class="flex items-center gap-3 mb-8">
            <div class="w-2 h-6 bg-seagreen"></div>
            <h2 class="text-xl font-black uppercase tracking-tighter">New <span class="text-seagreen">Check-In</span></h2>
          </div>
          
          <form (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
              <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Customer/Driver Name</label>
              <input type="text" [(ngModel)]="newIntake.customer_name" name="c_name" 
                     class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-700 focus:border-seagreen outline-none transition-all" 
                     placeholder="Enter full name" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Fleet Plate</label>
                <select [(ngModel)]="newIntake.vehicle_id" name="v_id" (change)="onFleetVehicleSelect($event)" 
                        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-seagreen outline-none appearance-none">
                  <option [ngValue]="null" class="bg-[#121214]" disabled>-- Outside Vehicle --</option>
                  <option *ngFor="let v of vehicles" [value]="v.vehicle_id || v.id" class="bg-[#121214]">
                    {{ v.registration_number }}
                  </option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Vehicle Details</label>
                <input type="text" [(ngModel)]="newIntake.vehicle_details" name="v_details" 
                       class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-700 outline-none" 
                       placeholder="Make/Model/Color">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Work Description</label>
              <textarea [(ngModel)]="newIntake.description" name="desc" rows="3" 
                        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-700 focus:border-seagreen outline-none" 
                        placeholder="Log technical issues or intake notes..."></textarea>
            </div>

            <button type="submit" class="w-full bg-seagreen text-black py-4 rounded-xl font-black uppercase tracking-widest shadow-[0_0_20px_rgba(46,213,115,0.2)] hover:shadow-seagreen/40 hover:-translate-y-0.5 transition-all">
              Initialize Handover
            </button>
          </form>
        </div>

        <div class="lg:col-span-7 bg-[#121214] rounded-2xl shadow-2xl border border-white/5 overflow-hidden flex flex-col">
          <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/[0.02]">
            <h2 class="text-sm font-bold uppercase tracking-widest text-gray-400">Intake Stream</h2>
            <span class="flex items-center gap-2">
              <span class="w-2 h-2 bg-seagreen rounded-full animate-ping"></span>
              <span class="text-[10px] font-mono text-seagreen">LIVE MONITORING</span>
            </span>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-black/20 text-seagreen font-bold uppercase text-[10px] tracking-widest">
                <tr>
                  <th class="px-6 py-4">Vehicle ID</th>
                  <th class="px-6 py-4">Subject</th>
                  <th class="px-6 py-4">Status</th>
                  <th class="px-6 py-4 text-right">Control</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5">
                <tr *ngFor="let item of intakes" class="hover:bg-white/[0.02] transition-colors group">
                  <td class="px-6 py-4 font-mono font-bold text-gray-300">{{ item.vehicle_plate }}</td>
                  <td class="px-6 py-4">
                    <div class="text-white font-medium">{{ item.customer_name }}</div>
                    <div class="text-[10px] text-gray-500 truncate max-w-[150px]">{{ item.description }}</div>
                  </td>
                  <td class="px-6 py-4">
                    <span *ngIf="item.status === 'Completed'" class="flex items-center gap-1.5 text-seagreen text-[10px] font-black uppercase tracking-widest bg-seagreen/10 px-3 py-1 rounded-full border border-seagreen/20">
                      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
                      Completed
                    </span>
                    <span *ngIf="item.status !== 'Completed'" class="flex items-center gap-1.5 text-orange-400 text-[10px] font-black uppercase tracking-widest bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20">
                      <span class="w-1.5 h-1.5 bg-orange-400 rounded-full animate-pulse"></span>
                      In Transit
                    </span>
                  </td>
                  <td class="px-6 py-4 text-right">
                    <button *ngIf="item.status !== 'Completed'" 
                            (click)="onRelease(item.intake_id)"
                            class="bg-white/5 text-white hover:bg-seagreen hover:text-black border border-white/10 px-4 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all">
                      Release
                    </button>
                    <span *ngIf="item.status === 'Completed'" class="text-gray-600 text-[10px] font-mono italic">
                      SECURED
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
