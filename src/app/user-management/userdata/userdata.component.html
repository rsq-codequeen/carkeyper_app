<div class="flex flex-col w-full min-h-screen bg-[#0a0a0c] text-white">
  <app-navbar [message]="'All Users'" class="flex-none"></app-navbar>

  <div class="flex flex-1 pt-16">
    <app-sidebar class="w-20"></app-sidebar>

    <div class="flex-1 p-6 overflow-y-auto custom-scrollbar">
      <main class="w-full h-auto mt-10">
        
        <div class="mx-6 mb-8 flex justify-between items-center">
          <h2 class="text-2xl font-black tracking-tighter uppercase">
            System <span class="text-seagreen">Personnel</span>
          </h2>
          <app-button
            [buttonText]="'Add user'"
            (buttonClick)="openAddUserModal()"
          ></app-button>
        </div>

        <app-userform
          *ngIf="showModal"
          [user]="selectedUser"  
          (close)="closeModal()"
          (userAdded)="onUserAdded($event)"
          (userUpdated)="onUserUpdated($event)"
        ></app-userform>

        <div class="bg-[#121214] border border-white/5 overflow-x-auto rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.5)] m-6">
          <table class="w-full table-auto border-collapse text-left text-sm">
            <thead class="bg-white/5 border-b border-white/10 text-xs uppercase text-seagreen font-bold tracking-widest">
              <tr>
                <th scope="col" class="px-6 py-5">#</th>
                <th scope="col" class="px-6 py-5">Name</th>
                <th scope="col" class="px-6 py-5">Email</th>
                <th scope="col" class="px-6 py-5">Contact</th>
                <th scope="col" class="px-6 py-5">Access Level</th>
                
                <th scope="col" class="px-6 py-5">Reg. Date</th>
                <th scope="col" class="px-6 py-5 text-center">Actions</th>
              </tr>
            </thead>
            
            <tbody class="divide-y divide-white/5">
              <tr *ngIf="users.length === 0">
                <td colspan="8" class="py-20 text-center">
                  <div class="flex flex-col items-center opacity-40">
                    <img src="../../../assets/Frame.png" alt="Empty" class="w-32 mb-4 grayscale invert">
                    <h1 class="text-xl font-bold tracking-widest uppercase text-gray-500">No Users in Database</h1>
                  </div>
                </td>
              </tr>

              <tr *ngFor="let user of users; let i = index" 
                  class="hover:bg-seagreen/[0.02] transition-colors duration-200">
                <td class="px-6 py-4 font-mono text-gray-500">{{ i + 1 }}</td>
                <td class="px-6 py-4 font-bold text-gray-200">{{ user.name }}</td>
                <td class="px-6 py-4 text-gray-400 font-mono text-xs">{{ user.email }}</td>
                <td class="px-6 py-4 text-gray-400">{{ user.contact }}</td>
                <td class="px-6 py-4">
                  <app-admin-button *ngIf="user.role.toLowerCase()==='admin'"></app-admin-button>
                  <app-mechanic-button *ngIf="user.role.toLowerCase()==='mechanic'"></app-mechanic-button>
                  <app-driver-button *ngIf="user.role.toLowerCase()==='driver'"></app-driver-button>
                </td>
                
                <td class="px-6 py-4 text-gray-500 text-xs font-mono">{{currentDate | date:'dd/MM/yyyy'}}</td>
                <td class="px-6 py-4">
                  <div class="flex items-center justify-center gap-4">
                    <button (click)="openEditModal(user)" class="hover:scale-110 transition-transform">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-seagreen drop-shadow-[0_0_8px_rgba(255,77,0,0.4)]">
                        <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
                      </svg>
                    </button>
                    <button (click)="onDelete(user)" class="hover:scale-110 transition-transform">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-red-500/80 hover:text-red-500 drop-shadow-[0_0_8px_rgba(239,68,68,0.4)]">
                        <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
                      </svg>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</div>
