<div class="flex flex-col w-full min-h-screen bg-[#0a0a0c] text-white">
  <app-navbar [message]="'Add Checklist'" class="flex-none"></app-navbar>

  <div class="flex flex-1 pt-16">
    <app-sidebar class="w-20"></app-sidebar>

    <div class="flex-1 p-6 overflow-y-auto custom-scrollbar">
      <main class="w-full h-auto mt-10 max-w-5xl mx-auto">
        
        <h2 class="text-2xl font-black tracking-tighter uppercase mb-6 mx-4">
          Protocol <span class="text-seagreen">Configuration</span>
        </h2>

        <div class="flex flex-col bg-[#121214] border border-white/5 overflow-x-auto rounded-2xl p-8 shadow-[0_20px_50px_rgba(0,0,0,0.5)] m-4 relative">
          
          <div class="absolute top-0 right-0 w-32 h-32 bg-seagreen/5 blur-3xl rounded-full"></div>

          <div class="space-y-4">
            <div>
              <label for="title" class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Checklist Title</label>
              <input
                type="text"
                placeholder="e.g. Morning Pre-Drive Inspection"
                class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-700 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all"
                [(ngModel)]="checklist.checklistTitle"
              />
            </div>

            <div>
              <label for="description" class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Description</label>
              <input
                type="text"
                placeholder="Detailed scope of the inspection protocol"
                class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-700 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all"
                [(ngModel)]="checklist.checklistDesc"
              />
            </div>
          </div>

          <div class="flex flex-col md:flex-row gap-6 w-full mt-6">
            <div class="flex flex-col w-full md:w-1/2">
              <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Vehicle Selection</label>
              <select class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white focus:border-seagreen outline-none appearance-none" [(ngModel)]="checklist.assignedVehicle">
                <option value="" disabled class="bg-[#121214]"> Select a Vehicle </option>
                <option *ngFor="let vehicle of vehicles" [value]="vehicle.make" class="bg-[#121214]">{{vehicle.make}}</option>
              </select>
            </div>

            <div class="flex flex-col w-full md:w-1/2">
              <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Checklist Time</label>
              <select class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-3 text-white focus:border-seagreen outline-none appearance-none" [(ngModel)]="checklist.checklistTime">
                <option value="Beginning of day" class="bg-[#121214]">Beginning of day</option>
                <option value="End of day" class="bg-[#121214]">End of day</option>
              </select>
            </div>
          </div>

          <div class="w-full h-px bg-gradient-to-r from-transparent via-white/10 to-transparent my-10"></div>

          <div class="bg-black/20 p-4 rounded-xl border border-white/5 mb-8">
            <app-text-editor (addClick)="addItemToList($event)"></app-text-editor>
          </div>

          <section>
            <h3 class="text-xs font-bold uppercase tracking-widest text-seagreen mb-4 flex items-center gap-2">
              <span class="w-2 h-2 bg-seagreen rounded-full animate-pulse"></span>
              Live Checklist Items
            </h3>
            
            <div class="flex flex-col w-full min-h-[150px] bg-black/40 border border-white/5 rounded-xl overflow-hidden">
              <ul class="divide-y divide-white/5">
                <li *ngFor="let item of checklistItems; let i = index" 
                    class="flex justify-between items-center p-4 hover:bg-white/[0.02] transition-colors group">
                  
                  <div class="flex items-center gap-4 flex-grow">
                    <span class="font-mono text-gray-600 text-sm">{{ i + 1 | number:'2.0' }}</span>
                    
                    <input
                      *ngIf="editIndex === i"
                      type="text"
                      [(ngModel)]="editableContent"
                      (keyup.enter)="saveEdit()"
                      class="flex-grow bg-seagreen/10 border border-seagreen/50 rounded px-2 py-1 text-white outline-none"
                    />
                    
                    <span *ngIf="editIndex !== i" [innerHTML]="item" class="text-gray-300 text-sm"></span>
                  </div>

                  <div class="flex gap-4 ml-4">
                    <button (click)="editIndex === i ? saveEdit() : startEdit(i)" class="transition-transform hover:scale-110">
                       <svg *ngIf="editIndex !== i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-seagreen/60 hover:text-seagreen">
                        <path d="M21.731 2.269a2.625 2.625 0 0 0-3.712 0l-1.157 1.157 3.712 3.712 1.157-1.157a2.625 2.625 0 0 0 0-3.712ZM19.513 8.199l-3.712-3.712-12.15 12.15a5.25 5.25 0 0 0-1.32 2.214l-.8 2.685a.75.75 0 0 0 .933.933l2.685-.8a5.25 5.25 0 0 0 2.214-1.32L19.513 8.2Z" />
                      </svg>
                      <svg *ngIf="editIndex === i" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-cyan-400">
                        <path fill-rule="evenodd" d="M19.916 4.626a.75.75 0 0 1 .208 1.04l-9 13.5a.75.75 0 0 1-1.154.114l-6-6a.75.75 0 0 1 1.06-1.06l5.353 5.353 8.493-12.739a.75.75 0 0 1 1.04-.208Z" clip-rule="evenodd" />
                      </svg>
                    </button>

                    <button (click)="onDeleteClick(i)" class="transition-transform hover:scale-110">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 text-red-500/40 hover:text-red-500">
                        <path fill-rule="evenodd" d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z" clip-rule="evenodd" />
                      </svg>
                    </button>
                  </div>
                </li>
              </ul>
            </div>
          </section>

          <div class="flex flex-row mt-10 gap-4 justify-end">
            <app-cancel-button [btn_text]="'Discard'"></app-cancel-button>
            <app-button [buttonText]="'Save Protocol'" (buttonClick)="saveChecklistData()"></app-button>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
