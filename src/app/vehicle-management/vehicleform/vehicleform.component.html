<div class="fixed inset-0 flex items-center justify-center z-[100]">
  <div class="absolute inset-0 bg-black/80 backdrop-blur-sm z-40" (click)="closeModal()"></div>

  <div class="bg-[#121214] border border-white/10 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] w-full max-w-2xl z-50 p-8 relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-seagreen to-transparent"></div>

    <header class="flex justify-between items-center mb-8">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-seagreen/10 rounded-lg text-seagreen">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            <path d="M3.375 4.5C2.339 4.5 1.5 5.34 1.5 6.375V13.5h12V6.375c0-1.036-.84-1.875-1.875-1.875h-8.25ZM13.5 15h-12v2.625c0 1.035.84 1.875 1.875 1.875h.375a3 3 0 1 1 6 0h3a.75.75 0 0 0 .75-.75V15Z" />
            <path d="M8.25 19.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0ZM15.75 6.75a.75.75 0 0 0-.75.75v11.25c0 .087.015.17.042.248a3 3 0 0 1 5.958.464c.853-.175 1.522-.935 1.464-1.883a18.659 18.659 0 0 0-3.732-10.104 1.837 1.837 0 0 0-1.47-.725H15.75Z" />
            <path d="M19.5 19.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0Z" />
          </svg>
        </div>
        <h3 class="text-xl font-black text-white uppercase tracking-tighter">Manage <span class="text-seagreen">Vehicle Asset</span></h3>
      </div>
      <button (click)="closeModal()" class="text-gray-500 hover:text-seagreen transition-colors text-2xl font-light">✕</button>
    </header>

    <form [formGroup]="vehicleForm" (ngSubmit)="submit()" class="space-y-6">
      <div class="grid grid-cols-2 gap-6">
        
        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Registration Number</label>
          <input formControlName="registration_number" type="text" 
                 class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-gray-600 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all font-mono" 
                 placeholder="e.g. ABC-1234"/>
          <div *ngIf="vehicleForm.get('registration_number')?.touched && vehicleForm.get('registration_number')?.invalid" class="text-red-500 text-xs mt-1 font-medium italic">
            <div *ngIf="vehicleForm.get('registration_number')?.errors?.['required']">Registration is required</div>
            <div *ngIf="vehicleForm.get('registration_number')?.errors?.['pattern']">Invalid format (letters/numbers/dashes)</div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Vehicle Type</label>
          <input formControlName="type" type="text" 
                 class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-gray-600 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all" 
                 placeholder="e.g. Pickup, Sedan"/>
          <div *ngIf="vehicleForm.get('type')?.touched && vehicleForm.get('type')?.invalid" class="text-red-500 text-xs mt-1 font-medium italic">Type is required</div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Color</label>
          <input formControlName="color" type="text" 
                 class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-gray-600 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all" 
                 placeholder="e.g. Arctic White"/>
          <div *ngIf="vehicleForm.get('color')?.touched && vehicleForm.get('color')?.invalid" class="text-red-500 text-xs mt-1 font-medium italic">Color is required</div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Make / Brand</label>
          <input formControlName="make" type="text" 
                 class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-gray-600 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all" 
                 placeholder="e.g. Toyota, Honda"/>
          <div *ngIf="vehicleForm.get('make')?.touched && vehicleForm.get('make')?.invalid" class="text-red-500 text-xs mt-1 font-medium italic">Make is required</div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Fuel Type</label>
          <select formControlName="fueltype" 
                  class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:border-seagreen outline-none appearance-none">
            <option value="" disabled class="bg-[#121214]">Select fuel type</option>
            <option value="petrol" class="bg-[#121214]">Petrol</option>
            <option value="diesel" class="bg-[#121214]">Diesel</option>
            <option value="electric" class="bg-[#121214]">Electric</option>
            <option value="hybrid" class="bg-[#121214]">Hybrid</option>
          </select>
          <div *ngIf="vehicleForm.get('fueltype')?.touched && vehicleForm.get('fueltype')?.invalid" class="text-red-500 text-xs mt-1 italic font-medium">Fuel type is required</div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Transmission</label>
          <select formControlName="transmission" 
                  class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white focus:border-seagreen outline-none appearance-none">
            <option value="" disabled class="bg-[#121214]">Select transmission</option>
            <option value="manual" class="bg-[#121214]">Manual</option>
            <option value="automatic" class="bg-[#121214]">Automatic</option>
          </select>
          <div *ngIf="vehicleForm.get('transmission')?.touched && vehicleForm.get('transmission')?.invalid" class="text-red-500 text-xs mt-1 italic font-medium">Transmission is required</div>
        </div>

        <div class="col-span-2">
          <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Model Details</label>
          <input formControlName="model" type="text" 
                 class="w-full bg-black/40 border border-white/10 rounded-lg px-4 py-2.5 text-white placeholder-gray-600 focus:border-seagreen focus:ring-1 focus:ring-seagreen/30 outline-none transition-all" 
                 placeholder="e.g. 2024 - Hilux Revo V"/>
          <div *ngIf="vehicleForm.get('model')?.touched && vehicleForm.get('model')?.invalid" class="text-red-500 text-xs mt-1 font-medium italic">Model description is required</div>
        </div>
      </div>

      <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-white/5">
        <button type="button" (click)="closeModal()" 
                class="px-6 py-2.5 text-gray-400 hover:text-white font-bold uppercase text-xs tracking-widest transition-colors">
          Cancel
        </button>
        <button type="submit" 
                class="px-8 py-2.5 bg-seagreen text-black font-black uppercase text-xs tracking-widest rounded-lg flex items-center shadow-[0_0_20px_rgba(46,204,113,0.3)] hover:shadow-[0_0_30px_rgba(46,204,113,0.5)] transition-all active:scale-95">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-5 mr-2">
            <path fill-rule="evenodd" d="M6.32 2.577a49.255 49.255 0 0 1 11.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 0 1-1.085.67L12 18.089l-7.165 3.583A.75.75 0 0 1 3.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93Z" clip-rule="evenodd" />
          </svg>
          Commit Vehicle Data
        </button>
      </div>
    </form>
  </div>
</div>
